[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# NOTE: before publishing to PyPI, verify the distribution name "calkit"
# is not already taken. If it is, rename the distribution here (keep the
# import name `calkit`).
name = "calkit"
version = "0.3.0"
description = "Framework-agnostic iCalendar (.ics) generation: data in, RFC 5545 bytes out."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "calkit contributors" }]
keywords = ["icalendar", "ics", "calendar", "rfc5545", "vevent", "vcalendar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Typing :: Typed",
]
dependencies = [
    "icalendar>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/tsgs/calkit"
Source = "https://github.com/tsgs/calkit"

[tool.hatch.build.targets.wheel]
packages = ["src/calkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
